name: renata_tv
description: "Aplikasi Nonton TV Android Native - RENATA TV"
publish_to: "none"
version: 1.5.0+6

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # In-App WebView untuk embed stream (Detik, RCTI+, YouTube, CNN, CNBC, TVRI)
  webview_flutter: ^4.7.0
  # Video player untuk stream m3u8 langsung
  video_player: ^2.8.3
  chewie: ^1.7.5
  # YouTube player support (9.0.4 = last release compatible with Flutter 3.24.x;
  # 9.1.x requires Flutter 3.27+ due to Color.withValues)
  youtube_player_flutter: 9.0.4
  # Local storage
  shared_preferences: ^2.2.2
  # HTTP & Downloader untuk Auto Update APK
  http: ^1.2.1
  dio: ^5.4.1
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  open_filex: ^4.4.0
  package_info_plus: ^8.0.0
  # Utilitas layar & ikon
  wakelock_plus: ^1.1.4
  cached_network_image: ^3.3.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/logos/
