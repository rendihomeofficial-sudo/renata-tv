# Memori: mesin ini hanya 8 GB, jadi heap Gradle dibatasi 3G (bukan 4G)
# supaya JVM lain (Kotlin daemon, Dart/Flutter) tetap muat.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# Kurangi parallelism supaya tidak ada beberapa worker besar hidup bersamaan
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true

# Kotlin daemon dipisah dengan heap kecil
kotlin.daemon.jvmargs=-Xmx1536m

# AndroidX
android.useAndroidX=true

# Jetifier DIMATIKAN: semua plugin sudah AndroidX.
# Jetifier sebelumnya OOM saat mentransform jar Robolectric yang sangat besar.
android.enableJetifier=false
